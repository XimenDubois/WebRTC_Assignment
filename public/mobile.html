<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Archers Controller</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://unpkg.com/simple-peer@9.11.1/simplepeer.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>

<body class="mobile-page">
    <main class="mobile-layout">
        <section class="mobile-card">
            <h1 class="mobile-title">Phone Controller</h1>
            <p id="status" class="mobile-status">Verbinding: wachten...</p>
            <button id="enableMotionButton" type="button">Enable tilt</button>
        </section>

        <section class="mobile-card">
            <strong>Tilt = Angle</strong>
            <div class="mobile-value-row">
                <span>Angle</span>
                <span id="angleValue">0°</span>
            </div>
        </section>

        <section class="mobile-card">
            <strong>Swipe = Power</strong>
            <div id="swipeZone" class="mobile-swipe-zone">Swipe van rechts naar links om power te zetten</div>
            <div class="mobile-power-track">
                <div id="powerFill" class="mobile-power-fill"></div>
            </div>
            <div class="mobile-value-row">
                <span>Power</span>
                <span id="powerValue">0%</span>
            </div>
        </section>

        <section class="mobile-card">
            <button id="shootButton" type="button">Shoot</button>
        </section>
    </main>

    <script src="mobile.js"></script>
</body>

</html>
