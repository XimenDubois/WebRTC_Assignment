<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Archers</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <main class="desktop-layout">
        <header class="topbar">
            <h1>Archers</h1>
            <div class="hud-panel">
                <div id="score" class="score">Score: 0</div>
                <div id="lives" class="lives" aria-label="Lives"></div>
                <button id="soundToggle" class="sound-toggle muted" type="button">🔇 Sound: OFF</button>
            </div>
        </header>

        <section class="game-wrapper">
            <div class="canvas-stage">
                <canvas id="gameCanvas" width="960" height="540" aria-label="Boogschiet spelcanvas"></canvas>
                <div id="gameOverOverlay" class="game-over-overlay" aria-live="polite" hidden>
                    <h2>Game Over</h2>
                    <p id="endScore">End score: 0</p>
                    <button id="playAgainButton" class="play-again-button" type="button">Play again</button>
                </div>
            </div>

            <aside class="qr-panel">
                <h2>Connect to smartphone</h2>
                <p>Scan this QR-code to connect!</p>
                <div id="qrPlaceholder" class="qr-placeholder">QR-code placeholder</div>
            </aside>
        </section>
    </main>

    <script src="https://unpkg.com/simple-peer@9.11.1/simplepeer.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="desktop.js"></script>
</body>

</html>
